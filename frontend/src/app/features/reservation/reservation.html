<div style="max-width: 600px; margin: 2rem auto; padding: 1rem;">
  <h2>Réserver un match</h2>

  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 1rem;">
      <label for="terrain">Terrain</label><br>
      <select id="terrain" [(ngModel)]="idTerrainSelectionne" name="terrain" style="width: 100%; padding: 0.5rem;">
        <option [ngValue]="null">-- Choisir un terrain --</option>
        @for (terrain of terrains; track terrain.idTerrain) {
          <option [ngValue]="terrain.idTerrain">
            {{ terrain.site.nom }} — {{ terrain.numero }}
          </option>
        }
      </select>
    </div>

    <div style="margin-bottom: 1rem;">
      <label for="date">Date</label><br>
      <input id="date" type="date" [(ngModel)]="date" name="date" style="width: 100%; padding: 0.5rem;" />
    </div>

    <div style="margin-bottom: 1rem;">
      <label for="heure">Heure</label><br>
      <input id="heure" type="time" [(ngModel)]="heure" name="heure" style="width: 100%; padding: 0.5rem;" />
    </div>

    <div style="margin-bottom: 1rem;">
      <label for="statut">Type de match</label><br>
      <select id="statut" [(ngModel)]="statut" name="statut" style="width: 100%; padding: 0.5rem;">
        <option value="PRIVE">Privé</option>
        <option value="PUBLIC">Public</option>
      </select>
    </div>

    @if (erreur) {
      <p style="color: red;">{{ erreur }}</p>
    }
    @if (succes) {
      <p style="color: green;">{{ succes }}</p>
    }

    <button type="submit" [disabled]="chargement" style="width: 100%; padding: 0.75rem;">
      {{ chargement ? 'Envoi...' : 'Réserver' }}
    </button>
  </form>

  <hr style="margin: 2rem 0;">

  <h3>Terrains disponibles</h3>
  <ul>
    @for (terrain of terrains; track terrain.idTerrain) {
      <li>{{ terrain.site.nom }} — {{ terrain.numero }}</li>
    }
  </ul>
</div>
