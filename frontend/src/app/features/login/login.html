<div style="max-width: 400px; margin: 4rem auto;">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Matricule</mat-label>
          <input matInput [(ngModel)]="matricule" name="matricule" placeholder="Ex: G0042" />
        </mat-form-field>

        @if (erreur) {
          <p style="color: red;">{{ erreur }}</p>
        }

        <button mat-raised-button color="primary" type="submit" [disabled]="chargement" style="width: 100%;">
          {{ chargement ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
