<div style="max-width: 400px; margin: 4rem auto; padding: 2rem; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Connexion</h2>

  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 1rem;">
      <label for="matricule">Matricule</label><br>
      <input
        id="matricule"
        type="text"
        [(ngModel)]="matricule"
        name="matricule"
        placeholder="Ex: G0042"
        style="width: 100%; padding: 0.5rem;"
      />
    </div>

    @if (erreur) {
      <p style="color: red;">{{ erreur }}</p>
    }

    <button type="submit" [disabled]="chargement" style="width: 100%; padding: 0.75rem;">
      {{ chargement ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</div>
