<h2 mat-dialog-title>{{ data.admin ? 'Modifier l\'administrateur' : 'Nouvel administrateur' }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Nom</mat-label>
    <input matInput [(ngModel)]="nom" name="nom" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Prénom</mat-label>
    <input matInput [(ngModel)]="prenom" name="prenom" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="email" name="email" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Type d'administrateur</mat-label>
    <mat-select [(ngModel)]="typeAdmin" name="typeAdmin">
      <mat-option value="GLOBAL">Global</mat-option>
      <mat-option value="SITE">Site</mat-option>
    </mat-select>
  </mat-form-field>

  @if (typeAdmin === 'SITE') {
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Site géré</mat-label>
      <mat-select [(ngModel)]="siteId" name="siteId">
        @for (site of data.sites; track site.idSite) {
          <mat-option [value]="site.idSite">{{ site.nom }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onAnnuler()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onValider()">Valider</button>
</mat-dialog-actions>
