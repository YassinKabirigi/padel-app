spring.application.name=padel-backend

# Connexion base de donnees
# Utilisateur dedie 'padel_app' avec droits limites (pas de sa/sysadmin)
# Droits accordes : db_datareader, db_datawriter, db_ddladmin (pour Flyway)
# Droits refuses : sysadmin, serveradmin, securityadmin, dbcreator
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=padel;encrypt=false;trustServerCertificate=true
spring.datasource.username=padel_app
spring.datasource.password=PadelApp2026!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Flyway
spring.flyway.enabled=true
